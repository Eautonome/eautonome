id: https://w3id.org/eautonome/linkml-sosa-profile
name: sosa-eautonome
title: Eautonome SOSA application profile
description: LinkML application profile for the SOSA terms used in Eautonome. Slots
  are attached to classes from schema:domainIncludes in the pinned W3C SOSA modules,
  including subclasses via rdfs:subClassOf. This profile does not replace the Eautonome
  OWL ontology. LinkML names are prefixed with Sosa or sosa_ so the profile can be
  composed with SAREF-LinkML. class_uri and slot_uri remain the official SOSA IRIs.
prefixes:
  linkml: https://w3id.org/linkml/
  sosa: http://www.w3.org/ns/sosa/
  eau: https://w3id.org/eautonome/
default_prefix: sosa
imports:
- linkml:types
slots:
  sosa_deployed_on_platform:
    slot_uri: sosa:deployedOnPlatform
    title: deployed on platform
    multivalued: true
    notes:
    - Attached using schema:domainIncludes from the pinned W3C SOSA modules, including
      subclasses via rdfs:subClassOf. schema:rangeIncludes is recorded as documentation
      only. No minCount or maxCount is added.
    comments:
    - 'schema:domainIncludes: sosa:Deployment'
    - 'schema:rangeIncludes: sosa:Platform'
    - 'rangeIncludes classes used in Eautonome, kept as documentation: Platform'
  sosa_deployed_system:
    slot_uri: sosa:deployedSystem
    title: deployed system
    multivalued: true
    notes:
    - Attached using schema:domainIncludes from the pinned W3C SOSA modules, including
      subclasses via rdfs:subClassOf. schema:rangeIncludes is recorded as documentation
      only. No minCount or maxCount is added.
    comments:
    - 'schema:domainIncludes: sosa:Deployment'
    - 'schema:rangeIncludes: sosa:Sensor, sosa:System'
    - 'rangeIncludes classes used in Eautonome, kept as documentation: Sensor, System'
  sosa_for_property:
