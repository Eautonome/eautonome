    - sosa_deployed_system
    - sosa_has_feature_of_interest
    - sosa_has_ultimate_feature_of_interest
    - sosa_start_time
  SosaFeatureOfInterest:
    class_uri: sosa:FeatureOfInterest
    title: Feature Of Interest
    slots:
    - sosa_has_property
    - sosa_is_feature_of_interest_of
  SosaObservation:
    class_uri: sosa:Observation
    title: Observation
    slots:
