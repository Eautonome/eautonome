    - sosa_observed_property
    - sosa_phenomenon_time
    - sosa_result_time
    - sosa_start_time
    - sosa_used_procedure
  SosaObservingProcedure:
    class_uri: sosa:ObservingProcedure
    title: Observing Procedure
    slots:
    - sosa_for_property
    - sosa_implemented_by
  SosaPlatform:
